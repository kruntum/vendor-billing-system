services:
  db:
    image: postgres:16-alpine
    container_name: vbs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    # เปลี่ยน YOUR_DOCKERHUB_USER เป็นชื่อ user ของคุณ
    image: chalermrit/vbs-server:latest
    container_name: vbs_server
    restart: always
    ports:
      - "8801:8801"
    # ใช้ไฟล์ .env จาก Server แทนการ Hardcode
    env_file:
      - .env
    environment:
      # สร้าง DATABASE_URL อัตโนมัติจากตัวแปรใน .env (เพื่อให้ชัวร์ว่าเชื่อมต่อ db ใน docker ได้)
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NODE_ENV: production
      PORT: 8801
      # รับค่า CLIENT_URL จาก .env สำหรับ CORS config (เช่น https://billing.mydomain.com)
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pdf_data:/app/public/pdfs
    command: sh -c "bunx --bun prisma migrate deploy && bun run start"

  client:
    # เปลี่ยน YOUR_DOCKERHUB_USER เป็นชื่อ user ของคุณ
    image: chalermrit/vbs-client:latest
    container_name: vbs_client
    restart: always
    ports:
      - "8802:80"
    volumes:
      - ./pdf_data:/usr/share/nginx/html/public/pdfs:ro
    depends_on:
      - server

volumes:
  # postgres_data: (ยกเลิกใช้ Volume แบบซ่อน)
  pdf_data:
